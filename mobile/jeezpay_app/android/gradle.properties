# Project-wide Gradle settings.

# Memory settings - CRITICAL for large Flutter projects
org.gradle.jvmargs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Build performance - DISABLE configuration cache (causes crashes with Flutter/AGP 8.7)
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=false
# DO NOT ENABLE: org.gradle.configuration-cache=true

# Android optimizations
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=36

# Kotlin
kotlin.code.style=official

# Worker limits (prevents deadlock)
org.gradle.workers.max=4